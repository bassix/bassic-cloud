; BassCloud — PHP upload limits override
; This file is read by PHP-FPM for web requests (php.net/manual/en/configuration.file.per-user.php).
; It allows very large file uploads as required by the project spec ("no upload limit").
;
; NOTE: upload_max_filesize = 0 does NOT mean unlimited in PHP — it means 0 bytes.
; Use a sufficiently large value instead (e.g. 10G covers almost any practical file).

upload_max_filesize = 10G
post_max_size = 10G

; Maximum execution time for uploads of large files (in seconds).
max_execution_time = 3600

; Maximum input time for parsing the request.
max_input_time = 3600

; Maximum amount of memory a script may consume.
memory_limit = 1G
