<div class="page-wrapper">
  <div class="content-container">

    <div class="page-hero">
      <mat-icon class="page-hero-icon">manage_accounts</mat-icon>
      <h1 class="page-hero-title">{{ 'account.title' | translate }}</h1>
      @if (currentUser) {
        <p class="page-hero-desc">{{ currentUser.username }}</p>
      }
    </div>

    <div class="account-card glass-card">
      @if (loading) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <form [formGroup]="form" (ngSubmit)="onSave()" class="account-form">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'account.email' | translate }}</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'account.newPassword' | translate }}</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>{{ 'account.passwordHint' | translate }}</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'account.confirmPassword' | translate }}</mat-label>
          <input matInput formControlName="confirmPassword"
                 [type]="hidePassword ? 'password' : 'text'"
                 autocomplete="new-password">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button class="save-btn" type="submit" [disabled]="form.invalid || loading">
            <mat-icon>save</mat-icon>
            {{ 'common.save' | translate }}
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
