<div class="page-wrapper">
  <div class="content-container">

    <div class="page-hero">
      <mat-icon class="page-hero-icon">build</mat-icon>
      <h1 class="page-hero-title">{{ 'tools.title' | translate }}</h1>
      <p class="page-hero-desc">{{ 'tools.description' | translate }}</p>
    </div>

    <div class="tools-grid">
      <a class="glass-card tool-card" [routerLink]="['password-generator']">
        <mat-icon class="tool-icon">vpn_key</mat-icon>
        <h2 class="tool-name">{{ 'tools.passwordGenerator' | translate }}</h2>
        <p class="tool-desc">{{ 'tools.passwordGeneratorDesc' | translate }}</p>
        <span class="tool-cta">{{ 'tools.openTool' | translate }} →</span>
      </a>
    </div>

  </div>
</div>
